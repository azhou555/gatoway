[project]
name = "gatoway"
version = "0.1.0"
description = "Cost-aware LLM gateway (MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "litellm",
    "asyncpg",
    "pgvector",
    "sentence-transformers",
    "python-dotenv",
    "httpx",
]

[project.optional-dependencies]
# httpx moved to [project].dependencies: gatoway/characterize.py is
# runtime code and must not depend on a dev extra.
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
# pytest-asyncio is listed as a dev dep but nothing previously set
# asyncio_mode, so `@pytest.mark.asyncio` tests across the suite (router,
# session, circuit breaker, batch_job) failed with "unknown marker" unless
# every invocation passed --asyncio-mode=auto by hand. auto mode also lets
# plain `async def test_*` work without the decorator.
asyncio_mode = "auto"
# Agentic benchmark grader tests are intentionally held-out fixtures and run
# only inside their isolated task container, not as part of this repo's suite.
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gatoway*"]
