services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gatoway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatoway}
      POSTGRES_DB: ${POSTGRES_DB:-gatoway}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gatoway} -d ${POSTGRES_DB:-gatoway}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
